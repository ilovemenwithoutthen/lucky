<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucky Me Lottery</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        #selectedName {
            font-size: 2em;
            color: red;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h1>Lucky Me Lottery</h1>
        <div class="form-group">
            <input type="text" id="nameInput" class="form-control" placeholder="Enter a name">
            <button id="addNameBtn" class="btn btn-primary mt-2">Add Name</button>
            <button id="selectNameBtn" class="btn btn-success mt-2">Select Random Name</button>
            <button id="resetBtn" class="btn btn-danger mt-2">Reset List</button>
        </div>
        <h3>Names List:</h3>
        <ul id="nameList" class="list-group mb-3"></ul>
        <div id="selectedName"></div>
        <div id="remainingCount" class="mt-3"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
